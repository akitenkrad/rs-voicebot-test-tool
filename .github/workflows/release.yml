name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            artifact-name: macos-aarch64
            prefix: mac
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            artifact-name: macos-x86_64
            prefix: mac
          - platform: ubuntu-22.04
            args: ""
            artifact-name: linux-x86_64
            prefix: linux
          - platform: windows-latest
            args: ""
            artifact-name: windows-x86_64
            prefix: win

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # ---- Linux system dependencies ----
      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            pkg-config

      # ---- Toolchain ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: voice-test-tool/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: voice-test-tool/src-tauri -> target

      # ---- Build ----
      - name: Install frontend dependencies
        working-directory: voice-test-tool
        run: npm ci

      - name: Build Tauri app
        id: build
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: voice-test-tool
          args: ${{ matrix.args }}

      # ---- Upload artifacts ----
      - name: Collect build artifacts
        shell: bash
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          mkdir -p release-artifacts
          target_dir="voice-test-tool/src-tauri/target"

          # Collect distributable files (.dmg, .deb, .AppImage, .msi, .exe)
          find "$target_dir" -path "*/release/bundle/*" -type f \
            \( -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \
               -o -name "*.msi" -o -name "*-setup.exe" \) \
            2>/dev/null | while IFS= read -r path; do
              filename="$(basename "$path")"
              dest="${PREFIX}-${filename}"
              echo "Copying: $path -> $dest"
              cp "$path" "release-artifacts/$dest"
            done

          # Compress macOS .app bundles as fallback when DMG creation fails
          find "$target_dir" -path "*/release/bundle/macos/*.app" -type d \
            2>/dev/null | while IFS= read -r app_path; do
              app_name="$(basename "$app_path")"
              parent_dir="$(dirname "$app_path")"
              # Detect architecture from path
              if echo "$app_path" | grep -q "aarch64"; then
                archive="${PREFIX}-${app_name%.app}_aarch64.app.tar.gz"
              elif echo "$app_path" | grep -q "x86_64"; then
                archive="${PREFIX}-${app_name%.app}_x86_64.app.tar.gz"
              else
                archive="${PREFIX}-${app_name}.tar.gz"
              fi
              echo "Compressing: $app_path -> $archive"
              tar -czf "release-artifacts/$archive" -C "$parent_dir" "$app_name"
            done

          echo "--- Collected artifacts ---"
          ls -la release-artifacts/ 2>/dev/null || echo "No artifacts found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-name }}
          path: release-artifacts/
          if-no-files-found: warn
          retention-days: 3

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: List release artifacts
        run: |
          echo "--- All release artifacts ---"
          ls -la release-artifacts/ 2>/dev/null || echo "No artifacts found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Voice Test Tool ${{ github.ref_name }}"
          body: |
            ## Voice Test Tool ${{ github.ref_name }}

            See the assets below to download and install for your platform.

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `mac-*.dmg` / `mac-*.app.tar.gz` (aarch64) |
            | macOS (Intel) | `mac-*.dmg` / `mac-*.app.tar.gz` (x86_64) |
            | Windows | `win-*.msi` / `win-*-setup.exe` |
            | Linux | `linux-*.deb` / `linux-*.AppImage` |
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
