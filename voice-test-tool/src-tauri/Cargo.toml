[package]
name = "voice-test-tool"
version = "0.1.0"
description = "Voice dialogue system testing tool"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voice_test_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10", features = ["devtools"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.6"
tauri-plugin-fs = "2.4"

# Audio
cpal = "0.15"
rodio = "0.19"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav"] }
rubato = "0.15"
dasp = "0.11"

# Async
tokio = { version = "1.49", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
uuid = { version = "1.20", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
notify = "6.1"
tempfile = "3.24"

# OpenAI TTS
openai-tools = { path = "../../../rs-openai-tools/openai-tools" }
csv = "1.3"
zip = "2.2"

# Platform-specific (Linux)
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"
# pipewire = "0.8"  # Optional: for PipeWire support

# Platform-specific (macOS)
[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = "0.11"

# Platform-specific (Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"] }
wasapi = "0.14"

[dev-dependencies]
rstest = "0.23"
mockall = "0.13"

[features]
default = []
pipewire = []  # Enable PipeWire support on Linux
